<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="ttl desc"><rect width="1200" height="530" fill="#ffffff"/><title id="ttl">Hessian classification across the primary GD and Newton experiments</title><desc id="desc">Four stacked horizontal bars, each fifty runs. GD attained fifty strict local minima per model, Newton 4 of 50 in exponential and 22 of 50 in logistic. Newton saddle counts were 44 and 24.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263447}.big{font-size:23px;font-weight:bold}.med{font-size:17px;font-weight:bold}.sm{font-size:14px}.tiny{font-size:13px}</style><text x="46" y="44" class="big">Final curvature classification · primary comparison</text><text x="46" y="70" class="sm">Each bar represents 50 registered attempts; no unsuccessful attempt is excluded.</text><rect x="50" y="92" width="15" height="15" rx="2" fill="#138878"/><text class="sm" x="71" y="105">Strict local minimum</text><rect x="274" y="92" width="15" height="15" rx="2" fill="#d96364"/><text class="sm" x="295" y="105">Indefinite saddle</text><rect x="471.9" y="92" width="15" height="15" rx="2" fill="#e4b25a"/><text class="sm" x="492.9" y="105">Inconclusive</text><rect x="626.3" y="92" width="15" height="15" rx="2" fill="#79869a"/><text class="sm" x="647.3" y="105">Nonstationary / failure</text><text x="46" y="180" class="med">Exponential · GD</text><rect x="350" y="150" width="725" height="44" rx="4" fill="#e5e7eb"/><rect x="350" y="150" width="725" height="44" fill="#138878"><title>Exponential · GD: 50 Strict local minimum</title></rect><text x="712.5" y="179" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">50</text><text x="1093" y="178" class="sm">50</text><text x="46" y="262" class="med">Exponential · Newton</text><rect x="350" y="232" width="725" height="44" rx="4" fill="#e5e7eb"/><rect x="350" y="232" width="58" height="44" fill="#138878"><title>Exponential · Newton: 4 Strict local minimum</title></rect><text x="379" y="261" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">4</text><rect x="408" y="232" width="638" height="44" fill="#d96364"><title>Exponential · Newton: 44 Indefinite saddle</title></rect><text x="727" y="261" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">44</text><rect x="1046" y="232" width="29" height="44" fill="#79869a"><title>Exponential · Newton: 2 Nonstationary / failure</title></rect><text x="1093" y="260" class="sm">50</text><text x="46" y="344" class="med">Logistic · GD</text><rect x="350" y="314" width="725" height="44" rx="4" fill="#e5e7eb"/><rect x="350" y="314" width="725" height="44" fill="#138878"><title>Logistic · GD: 50 Strict local minimum</title></rect><text x="712.5" y="343" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">50</text><text x="1093" y="342" class="sm">50</text><text x="46" y="426" class="med">Logistic · Newton</text><rect x="350" y="396" width="725" height="44" rx="4" fill="#e5e7eb"/><rect x="350" y="396" width="319" height="44" fill="#138878"><title>Logistic · Newton: 22 Strict local minimum</title></rect><text x="509.5" y="425" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">22</text><rect x="669" y="396" width="348" height="44" fill="#d96364"><title>Logistic · Newton: 24 Indefinite saddle</title></rect><text x="843" y="425" text-anchor="middle" style="font: bold 16px Arial;fill:#ffffff">24</text><rect x="1017" y="396" width="29" height="44" fill="#e4b25a"><title>Logistic · Newton: 2 Inconclusive</title></rect><rect x="1046" y="396" width="29" height="44" fill="#79869a"><title>Logistic · Newton: 2 Nonstationary / failure</title></rect><text x="1093" y="424" class="sm">50</text><text x="46" y="502" class="tiny">Source: archived model1_runs.csv / model2_runs.csv · Classification tolerance: 10⁻⁸ · Not stationary includes optimizer failures</text></svg>